[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flownium-cli"
version = "0.1.0"
description = "Connect real Hermes over Iroh, with optional Cloudflare transport"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
flownium = "flownium_cli:main"

[tool.setuptools]
py-modules = ["flownium_cli", "flownium_distribution"]
