name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  host:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -p test_cli.py -v
  service:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test service/core.test.mjs service/iroh-gateway.test.mjs
